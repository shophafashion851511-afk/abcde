<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tủ Đồ Xinh Của Tớ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;background:#fff6f8;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#333}
.header{text-align:center;padding:36px 20px 10px} .header h1{font-size:28px;margin:0;color:#ff4d6d;font-weight:800}
.gift-wrapper{max-width:1000px;margin:0 auto;padding:20px}
.gift-menu{display:flex;gap:10px;overflow-x:auto;padding:14px 6px 18px;position:sticky;top:0;background:rgba(255,246,248,.9);backdrop-filter:blur(8px);z-index:10;border-radius:20px}
.gift-menu::-webkit-scrollbar{display:none}
.gift-menu-item{background:#fff;border:2px dashed #ff8fab;padding:10px 20px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:14px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.05);transition:.22s ease;-webkit-tap-highlight-color:transparent!important;outline:none!important;user-select:none}
.gift-menu-item.active{background:#ff4d6d!important;color:#fff!important;border-style:solid;transform:translateY(-2px) scale(1.04)}
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;margin-top:12px}
.gift-card{display:block;position:relative;background:#fff;border-radius:24px;padding:14px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.07);color:#333!important;text-decoration:none!important;cursor:pointer;animation:gift-float 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent!important;outline:none!important}
.gift-card img{width:100%;height:180px;object-fit:cover;border-radius:16px;display:block}
.gift-card .lid{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.1);font-size:20px;z-index:2}
.gift-tag{position:absolute;top:14px;left:14px;background:#ff4d6d;color:#fff;font-size:11px;padding:5px 10px;border-radius:999px;font-weight:800;z-index:3}
@keyframes gift-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pagination{display:flex;gap:8px;justify-content:center;margin:28px 0 10px;flex-wrap:wrap}
.page-btn{background:#fff;border:2px dashed #ff8fab;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:800;font-size:14px;color:#ff4d6d;box-shadow:0 4px 10px rgba(0,0,0,.04);transition:.2s ease}
.page-btn.active{background:#ff4d6d;color:#fff;border-style:solid;transform:scale(1.08)}
.page-btn:disabled{opacity:.4;pointer-events:none}
@keyframes nhayNhay {0%,100%{transform:translateY(0)}25%{transform:translateY(-10px) scale(1.05)}50%{transform:translateY(0)}75%{transform:translateY(-5px) scale(1.03)}}
@keyframes bungRa {0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
@keyframes moBang {0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
#hop-qua{-webkit-tap-highlight-color:transparent!important;outline:none!important;user-select:none;}
</style>
</head>
<body>
<div class="header"><h1>👗 Tủ Đồ Xinh Của Tớ 🎀</h1><p style="color:#ff8fab;font-size:13px">Bấm sản phẩm là ra link ngay</p></div>
<div class="gift-wrapper">
<div class="gift-menu" id="giftMenu">
<div class="gift-menu-item active" data-filter="all">✨ Tất cả</div>
<div class="gift-menu-item" data-filter="ao">👚 Áo</div>
<div class="gift-menu-item" data-filter="quan">👖 Quần</div>
<div class="gift-menu-item" data-filter="vay">👗 Váy</div>
<div class="gift-menu-item" data-filter="phukien">👜 Phụ kiện</div>
</div>
<div class="gift-grid" id="giftGrid"></div>
<div class="pagination" id="pagination"></div>
</div>

<script>
const SP = [];
// ===== SẢN PHẨM CỦA CẬU - MUỐN THÊM THÌ COPY DÒNG NÀY DÁN TIẾP =====
SP.push({ten:"Quần trẻ em", gia:"Tùy chọn giá", loai:"quan", anh:"https://i.postimg.cc/sDJnkKBw/file-000000004d74820696b942476f462da1.png", link:"https://s.shopee.vn/4B0jsMXAT4"});
// 👉 DÁN TIẾP SẢN PHẨM MỚI VÀO ĐÂY NHÉ - CỨ COPY 1 DÒNG TRÊN DÁN XUỐNG

const grid=document.getElementById('giftGrid');
const menu=document.getElementById('giftMenu');
const pag=document.getElementById('pagination');
const label={ao:'Áo',quan:'Quần',vay:'Váy',phukien:'Phụ kiện'};
let currentFilter='all';
let currentPage=1;
const perPage=10;
function getFiltered(){ return currentFilter==='all'? SP : SP.filter(s=>s.loai===currentFilter); }
function render(){
const list=getFiltered();
const totalPage=Math.ceil(list.length/perPage) || 1;
if(currentPage>totalPage) currentPage=totalPage;
const start=(currentPage-1)*perPage;
const pageItems=list.slice(start, start+perPage);
grid.innerHTML=pageItems.map((sp,i)=>`
<div class="gift-card" data-link="${sp.link}" style="animation-delay:${(i%5)*0.12}s">
<span class="gift-tag">${label[sp.loai]}</span>
<img src="${sp.anh}" loading="lazy">
<h4 style="margin:12px 0 4px;font-size:14px">${sp.ten}</h4>
<p style="color:#ff4d6d;font-weight:800;margin:0">${sp.gia}</p>
</div>
`).join('');
grid.querySelectorAll('.gift-card').forEach(card=>{ card.onclick=()=>window.open(card.dataset.link,'_blank'); });
let html=''; html+=`<button class="page-btn" ${currentPage===1?'disabled':''} data-page="${currentPage-1}">‹</button>`;
for(let i=1;i<=totalPage;i++){ html+=`<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`; }
html+=`<button class="page-btn" ${currentPage===totalPage?'disabled':''} data-page="${currentPage+1}">›</button>`;
pag.innerHTML=html;
pag.querySelectorAll('.page-btn').forEach(btn=>{ btn.onclick=()=>{ currentPage=parseInt(btn.dataset.page); render(); window.scrollTo({top:0, behavior:'smooth'}); }; });
}
menu.querySelectorAll('.gift-menu-item').forEach(btn=>{ btn.onclick=()=>{ menu.querySelectorAll('.gift-menu-item').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); currentFilter=btn.dataset.filter; currentPage=1; render(); }; });
render();
</script>

<div id="popup-thacba" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;background:transparent;pointer-events:none;">
<div id="hop-qua" style="text-align:center;cursor:pointer;animation:nhayNhay 1s ease-in-out infinite;pointer-events:auto;">
<div style="font-size:92px;filter:drop-shadow(0 14px 18px rgba(255,77,109,.45))">🎁</div>
<p style="background:#ff4d6d;color:#fff;padding:8px 20px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(255,77,109,.4), 0 0 0 4px #fff;">Bấm để bóc quà!</p>
</div>
</div>
<script>
document.getElementById('hop-qua').onclick = function(){
let hop = this; hop.style.animation = 'bungRa 0.4s forwards';
setTimeout(()=>{ hop.innerHTML = `
<div style="background:#fff;padding:18px;border-radius:24px;max-width:340px;animation:moBang 0.35s ease-out;box-shadow:0 18px 40px rgba(255,77,109,.3), 0 0 0 4px #fff;border:2px dashed #ff8fab;pointer-events:auto">
<h3 style="color:#ff4d6d;margin:0 0 12px;font-size:17px;font-weight:800">Tadaa! Quà của nàng đây ✨</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="background:#fff6f8;padding:10px;border-radius:12px;color:#ff4d6d;font-weight:700">👗 Váy -15%</div>
<div style="background:#fff6f8;padding:10px;border-radius:12px;color:#ff4d6d;font-weight:700">👚 Áo -10%</div>
<div style="background:#fff6f8;padding:10px;border-radius:12px;color:#ff4d6d;font-weight:700">👜 Túi Freeship</div>
<div style="background:#fff6f8;padding:10px;border-radius:12px;color:#ff4d6d;font-weight:700">👠 Guốc THACBA15</div>
</div>
<button onclick="document.getElementById('popup-thacba').remove()" style="margin-top:14px;width:100%;background:#ff4d6d;color:#fff;border:0;padding:11px;border-radius:12px;font-weight:800;cursor:pointer">Xem ngay</button>
</div>`; hop.style.animation = 'none'; hop.style.transform = 'scale(1)'; hop.style.opacity = '1'; }, 400);
setTimeout(()=>{ document.getElementById('popup-thacba')?.remove() }, 6000);
}
</script>
</body>
</html>
